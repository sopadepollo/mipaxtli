[project]
name = "lsm-translator"
version = "0.1.0"
description = "Traductor del alfabeto dactilológico de la Lengua de Señas Mexicana (LSM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Solo hace falta para `make capture` y para la demo: la suite, el
# entrenamiento y la evaluacion corren sin nada de esto. Es lo que permite
# que `make test` pase en CI y dentro de Docker, donde no hay camara.
capture = [
    "mediapipe>=1.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.scripts]
lsm-golden = "lsm.cli.golden:main"
lsm-capture = "lsm.cli.capture:main"
lsm-train = "lsm.cli.train:main"
lsm-eval = "lsm.cli.evaluate:main"
lsm-demo = "lsm.cli.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

# `docs/` queda fuera. Desde la 0.16, ruff formatea los bloques ```python de los
# archivos Markdown, y en documentacion eso no es formatear: es reescribir. Un
# fragmento que ilustra el interior de una funcion va sangrado cuatro espacios a
# proposito; ruff lo des-indenta a nivel de modulo porque no sabe donde vive, y
# quien lo copie escribe codigo que no compila. Paso de verdad al ejecutar la
# Fase 3: ver docs/superpowers/plans/ y el ledger de esa ejecucion.
#
# `--check` no lo denunciaba —el Markdown no cuenta para el codigo de salida—,
# asi que el gate seguia verde mientras el dano se acumulaba.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
# Los tests comparan floats contra constantes del contrato; RUF001/RUF003 se
# quejan de los caracteres griegos (σ, τ, φ) que la especificación usa.
"*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# Dependencias opcionales de la captura. No estan instaladas en el entorno de
# la suite a proposito: `src/lsm/io/hands.py`, `camera.py` y `preview.py` las
# importan de forma diferida justo para eso.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "glosario: valida el contenido de docs/glosario-lsm.md. Estos tests estan en rojo a proposito hasta que el equipo humano complete el glosario contra la fuente primaria; bloquean la Fase 1. Para trabajar en el nucleo: pytest -m 'not glosario'",
]
