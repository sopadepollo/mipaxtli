[project]
name = "lsm-translator"
version = "0.1.0"
description = "Traductor del alfabeto dactilológico de la Lengua de Señas Mexicana (LSM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
lsm-golden = "lsm.cli.golden:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
# Los tests comparan floats contra constantes del contrato; RUF001/RUF003 se
# quejan de los caracteres griegos (σ, τ, φ) que la especificación usa.
"*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "glosario: valida el contenido de docs/glosario-lsm.md. Estos tests estan en rojo a proposito hasta que el equipo humano complete el glosario contra la fuente primaria; bloquean la Fase 1. Para trabajar en el nucleo: pytest -m 'not glosario'",
]
