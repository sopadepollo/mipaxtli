# Configuración del traductor de deletreo manual LSM.
#
# Todos los umbrales del sistema viven aquí. El esquema y los rangos válidos
# están en `src/lsm/config.py`; un campo desconocido o fuera de rango hace fallar
# la carga en vez de caer al valor por defecto en silencio.
#
# Los valores de este archivo son exactamente los de fábrica: sirve como
# documentación ejecutable y como punto de partida para calibrar. Al ajustar
# cualquiera de ellos, anotar en la bitácora de la sesión con qué dataset y con
# qué persona firmante se calibró.
#
# Lo que NO se configura aquí: las constantes del contrato de features (42
# componentes, T_ref = 24, MIN_SCALE = 1e-6, FEATURE_SPEC_VERSION). Cambiarlas
# rompe la paridad con la implementación de TypeScript, así que viven en
# `src/lsm/features.py` y su modificación exige incrementar la versión del spec.

# Calidad de la ventana antes de clasificar (feature-spec.md §2).
quality:
  # σ = dispersión media por componente dentro de la ventana, en unidades de mano.
  # Por encima de este valor la ventana se considera inestable: la mano se estaba
  # moviendo o el detector saltó, y clasificarla produce basura.
  # Subirlo acepta señas más temblorosas; bajarlo exige más quietud.
  max_dispersion: 0.08

# Parámetros ajustables de la extracción (feature-spec.md §3.3).
features:
  # w_τ: cuánto pesa el canal de trayectoria (2 componentes) frente al de forma
  # (42). Con w_τ = 0 las letras dinámicas se vuelven indistinguibles de sus
  # equivalentes estáticas: J colapsa sobre I. Subirlo hace que el trazo domine
  # sobre la configuración de los dedos.
  # 4.0 es un punto de partida razonado, no medido. Ajustar con datos reales.
  trajectory_weight: 4.0

# Clasificador de letras estáticas por centroides (ARQUITECTURA.md §4.3).
#
# Los tres valores viajan DENTRO del modelo exportado, no solo aquí: la
# reimplementación de JavaScript tiene que poder reproducir la decisión completa.
# Una que acertara la etiqueta pero no supiera cuándo callarse no serviría de
# nada (ARQUITECTURA.md §4.4 y §4.6).
static_knn:
  # Distancia con la que se compara contra los centroides: euclidean o cosine.
  # La euclidiana mira magnitud y dirección; la coseno ignora la magnitud, lo que
  # la hace más tolerante a una normalización de escala imperfecta y más ciega a
  # las diferencias de apertura de la mano.
  #
  # MEDIDO con el barrido completo de `make eval` (2250 puntos, leave-one-signer-out)
  # contra el dataset `fe0ada8710b6`: la coseno gana por +9 puntos de accuracy.
  # No es un ajuste fino, es la diferencia entre cumplir el criterio de la fase y
  # no cumplirlo, y quien lo paga son las letras de puño cerrado. `M` pasa de
  # 0.4474 a más de 0.90 y `S` de 0.4625 a 0.7750: las dos tenían la σ más baja
  # del dataset y cero confusiones —estaban bien grabadas— pero el puño comprime
  # la referencia muñeca-nudillo del paso 4, así que su vector apuntaba en la
  # dirección correcta con la magnitud equivocada. La euclidiana las rechazaba por
  # lejanas. Ver `docs/adr/0011-calibracion-de-la-fase-2.md`.
  metric: cosine

  # Distancia máxima al centroide más cercano para no devolver UNKNOWN, en
  # unidades de mano. Es la puerta que tapa lo que no se parece a ninguna letra:
  # una mano saludando cae lejos de las 22 clases, pero ALGUNA será la menos
  # lejana, y sin este umbral esa gana.
  #
  # MEDIDO contra el dataset `fe0ada8710b6`. El 1.0 anterior era un punto de
  # partida razonado sobre el corpus sintético y con distancia euclidiana; al
  # cambiar a coseno cambia la escala entera —la coseno vive en [0, 2]— y el
  # valor ya no es comparable con el viejo. No lo leas como "se hizo más
  # estricto": es otra unidad.
  max_distance: 0.25

  # Confianza mínima para no devolver UNKNOWN, en la escala del margen
  # normalizado d2 / (d1 + d2): vale 0.5 con dos centroides empatados y tiende a
  # 1 cuando el más cercano gana con holgura.
  #
  # Es la puerta que tapa las letras confundibles del §4.8 —M y N, S y T, V y W—,
  # donde el fallo no es que la mano esté lejos de todo sino que está igual de
  # cerca de dos cosas. Un 0.5 la desactiva.
  #
  # Comparte escala con segmentation.min_confidence a propósito: esta es el piso
  # del clasificador, aquella es el piso más alto que la máquina de estados exige
  # antes de escribir una letra en el texto.
  #
  # MEDIDO contra `fe0ada8710b6`, y elegido a mano en contra del barrido. El
  # barrido recomienda 0.5, que da el mejor accuracy (0.9578) porque APAGA esta
  # puerta: en la evaluación offline toda ventana es una letra de verdad, así que
  # callarse solo puede restar. En video en vivo la mayoría de los frames no son
  # ninguna letra y esta puerta es lo que impide escribir basura, de modo que
  # optimizarla contra el protocolo offline es optimizarla contra el caso
  # equivocado. 0.6 rechaza el 5.7% y aún deja 0.9261, por encima del criterio.
  min_margin: 0.6

# Suavizado temporal opcional sobre landmarks crudos (feature-spec.md §4).
smoothing:
  # α = 1.0 desactiva el suavizado (cada frame se usa tal cual). Valores menores
  # reducen el jitter de MediaPipe a costa de latencia y de emborronar los
  # movimientos rápidos, lo que perjudica justo a las letras con movimiento.
  # Si se activa aquí, hay que activarlo idénticamente en la implementación web.
  alpha: 1.0

# Clasificador dinámico (feature-spec.md §3.2 y §3.4).
dtw:
  # Radio de la ventana de Sakoe-Chiba sobre secuencias de 24 frames. Acota el
  # costo del DTW y evita alineaciones absurdas entre extremos de la seña.
  band_radius: 6
  # Mínimo de frames válidos para remuestrear a T_ref = 24. Por debajo la
  # secuencia se rechaza: estirar 2 frames a 24 inventa una trayectoria que nadie
  # ejecutó.
  min_source_frames: 4

# Máquina de estados de segmentación (ARQUITECTURA.md §4.2).
#
# LOS UMBRALES TEMPORALES ESTÁN EN MILISEGUNDOS, no en frames, y se convierten a
# frames con la tasa MEDIDA en tiempo de ejecución (`FrameThresholds`, y la §6.5
# de docs/feature-spec.md).
#
# En frames, el comportamiento cambiaba con la máquina sin que nadie lo notara.
# Los comentarios de este archivo decían "a 30 fps, 24 frames son 800 ms", y la
# medición de `lsm-demo --medir-fps` en la máquina de referencia dio 17.8 fps
# sostenidos: los mismos 24 frames eran 1348 ms. Cada umbral de esta sección
# duraba 1.7 veces lo que su comentario afirmaba. Ver
# docs/adr/0013-la-ventana-mezclada.md.
segmentation:
  # Cuánto pasado recuerda el buffer circular. La ventana que se clasifica sale
  # de aquí y no puede ser más larga.
  #
  # 800 ms son los 24 frames de antes a 30 fps: el valor no cambia de intención,
  # cambia de unidad. A los 17.8 fps medidos son 14 frames.
  buffer_ms: 800.0

  # detection_score mínimo para aceptar el frame del detector. Por debajo, el
  # frame se marca inválido e interrumpe la secuencia.
  min_detection_score: 0.5

  # Velocidad por debajo de la cual se considera que la mano está quieta, en
  # unidades de mano por frame (definida en `docs/feature-spec.md` §6). Es
  # invariante a la distancia a la cámara: 0.02 significa "cada landmark se movió
  # menos del 2% del largo muñeca-nudillo entre frame y frame".
  velocity_threshold: 0.02

  # Cuánta quietud continuada hace falta para pasar de TRACKING a STABLE.
  # Subirlo reduce emisiones espurias durante el viaje de una letra a otra;
  # bajarlo hace el deletreo más ágil.
  #
  # Es además el PISO de la ventana que se clasifica: desde la corrección del
  # ADR 0013, lo que se le pasa al clasificador son exactamente los frames
  # verificados estables, y esto es el mínimo de ellos. 167 ms son los 5 frames
  # de antes a 30 fps.
  stable_ms: 167.0

  # Confianza mínima para emitir. Por debajo se emite UNKNOWN y no se agrega nada
  # al texto. Ver ARQUITECTURA.md §4.4.
  #
  # Es el PISO. Con la emisión progresiva, una confianza entre este valor y
  # `high_confidence` no escribe todavía: sigue acumulando evidencia frame a
  # frame mientras la ventana crece, y emite al agotarla.
  min_confidence: 0.6

  # Confianza que emite SIN esperar más evidencia. De aquí sale la latencia
  # adaptativa: una letra sin vecinos cercanos se escribe con la ventana mínima
  # (`stable_frames`), y un par confundible acumula hasta despegarse o hasta
  # agotar la ventana.
  #
  # MEDIDO bajo leave-one-signer-out sobre el dataset de la Fase 2, 2437 muestras
  # no rechazadas:
  #
  #   umbral   emite ya   precisión   errores que pasan
  #     0.75      86.3%      0.9952        10
  #     0.80      79.4%      0.9979         4
  #     0.82      75.1%      0.9995         1
  #     0.85      67.1%      0.9994         1
  #
  # 0.82 es la rodilla: por encima, la precisión ya no mejora —el único error que
  # queda es un `E→C` con 0.9316 que ningún umbral por debajo de 0.94 excluye— y
  # la emisión inmediata se desploma, o sea un tercio de las letras esperando la
  # ventana entera sin ganar nada.
  #
  # LO QUE LA MEDIDA NO CUBRE: se midió sobre muestras completas de 24 frames, no
  # sobre las ventanas cortas de la emisión progresiva, que son más ruidosas. Una
  # ventana de 5 frames alcanzará 0.82 menos veces que una de 24, así que en vivo
  # se acumulará más de lo que dice la tabla. El error va hacia tardar, no hacia
  # escribir mal.
  high_confidence: 0.82

  # Cooldown tras emitir una letra, para no repetirla mientras la mano sigue
  # quieta.
  emit_cooldown_ms: 400.0

  # Cooldown tras un rechazo. Deliberadamente más corto que el de emisión: un
  # rechazo no debe castigar tanto como un acierto, o una letra que quedó apenas
  # bajo el umbral obligaría a rehacer la seña completa. Su otra función es
  # impedir que la máquina reclasifique la misma ventana en cada frame.
  #
  # OJO: solo se aplica a los rechazos de verdad. Una confianza entre
  # `min_confidence` y `high_confidence` no rechaza, acumula, y eso NO cuesta
  # cooldown: se reclasifica en el frame siguiente. Ver la emisión progresiva.
  reject_cooldown_ms: 133.0

  # Ausencia de mano continuada que lleva de vuelta a IDLE.
  missing_to_idle_ms: 267.0

# Detector de manos: los knobs que MediaPipe consume antes de que exista un
# frame de landmarks (src/lsm/io/hands.py). No van en `segmentation` porque la
# máquina de estados decide qué hacer con los frames ya detectados, no cómo
# detectarlos.
hands:
  # Bundle del modelo de MediaPipe Tasks. Pesa ~8 MB y no se versiona en el
  # repositorio: se descarga con `make model`. Ver docs/dataset-schema.md.
  model_path: data/models/hand_landmarker.task

  # Cuántas manos busca el detector. No es 1 a propósito: feature-spec.md §0.3
  # manda quedarse con la de mayor score cuando hay varias en el encuadre, y para
  # poder elegir hay que verlas. Con num_hands = 1 MediaPipe entrega la que él
  # prefiera y la regla del contrato queda sin efecto.
  num_hands: 2

  # Umbral de detección de palma, aplicado dentro de MediaPipe. Es el mismo
  # concepto que segmentation.min_detection_score, un paso más arriba: lo que no
  # lo supera ni llega a ser candidato.
  min_hand_detection_confidence: 0.5

  # Umbral de presencia de la mano entre frames de video.
  min_hand_presence_confidence: 0.5

  # Umbral del rastreador temporal. Por debajo, MediaPipe vuelve a detectar desde
  # cero en vez de seguir la mano del frame anterior. Bajarlo da más continuidad
  # y más deriva; subirlo, lo contrario.
  min_tracking_confidence: 0.5

  # Si hay que INVERTIR la lateralidad que reporta el detector.
  #
  # MEDIDO el 2026-09-08 con MediaPipe 1.0.1 (Tasks API, modo VIDEO, webcam por el
  # backend MSMF): alimentado con el cuadro sin espejar —como obliga
  # feature-spec.md §0.3— devuelve la mano ANATÓMICA. Mano derecha real -> "Right".
  # No hay que invertir nada, de ahí el false.
  #
  # La documentación histórica de MediaPipe decía lo contrario, y ese fue el valor
  # por defecto hasta que se comprobó contra una cámara de verdad. El interruptor
  # se conserva porque la convención ya cambió una vez entre versiones.
  #
  # Equivocarse aquí no rompe nada visible: el paso 2 canoniza TODAS las muestras
  # hacia la mano contraria, el vector queda coherente consigo mismo y el modelo
  # entrena sin quejarse. Por eso no se decide leyendo esto, se decide mirando:
  # `lsm-capture calibrar` lo verifica y lo registra, y `grabar` no arranca sin
  # ese registro. Cambiar este valor invalida las calibraciones anteriores.
  mediapipe_reports_mirrored_handedness: false

# Recolección de dataset (src/lsm/cli/capture.py, ARQUITECTURA.md §4.7).
capture:
  # Cámara y resolución pedidas a OpenCV. Es una petición: si el driver no la
  # soporta entrega otra, y por eso width/height viajan en cada frame guardado en
  # vez de darse por sabidos — el paso 1 de feature-spec.md los necesita.
  camera_index: 0
  frame_width: 1280
  frame_height: 720

  # Cuadros por segundo pedidos a la cámara. Además fija el paso de los
  # timestamps que consume el modo VIDEO de MediaPipe.
  camera_fps: 30

  # Espejar el preview, que es lo que espera quien se ve en pantalla. SOLO afecta
  # a lo que se dibuja: el frame que recibe el detector nunca va espejado
  # (feature-spec.md §0.3). Ponerlo en false no cambia ni un bit de lo grabado.
  preview_mirror: true

  # Frames que componen una muestra estática. A 30 fps, 24 frames son 800 ms de
  # mano sostenida. Subirlo exige más quietud y da una σ más representativa;
  # bajarlo hace la sesión más ágil y más ruidosa.
  static_frames: 24

  # Límites de una muestra dinámica. El mínimo evita guardar un trazo cortado —y
  # no puede bajar de dtw.min_source_frames, que config.py valida—; el máximo
  # impide que una grabación olvidada crezca sin fin.
  dynamic_min_frames: 12
  dynamic_max_frames: 90

  # Longitud de arco mínima de la trayectoria (feature-spec.md §3.1) para aceptar
  # una muestra DINÁMICA, en unidades de mano.
  #
  # Es el espejo de quality.max_dispersion: σ rechaza a la estática que se movió,
  # esto rechaza a la dinámica que no se movió. Sin él se puede grabar una "J" en
  # la que la mano apenas se desplazó, y en el dataset es indistinguible de una
  # "I" — envenena al clasificador dinámico por el lado contrario al que tapa la
  # clase negativa, y no hay forma de detectarla después mirando el archivo.
  #
  # Se mide sobre τ, que ya está dividida por la escala de la mano: el mismo trazo
  # cuenta igual de cerca que de lejos de la cámara.
  #
  # Es longitud de ARCO y no desplazamiento neto, y tiene que serlo: la Ñ y la Q
  # son rotaciones de ida y vuelta, la Z y la X vuelven cerca de donde empezaron.
  # Para todas ellas el neto es casi cero y el recorrido es largo. El precio es que
  # el arco acumula el temblor del detector, así que el umbral debe dejar margen
  # sobre ese ruido de fondo.
  #
  # 0.8 es un punto de partida RAZONADO, NO MEDIDO. Se calibra en la Fase 2 con
  # trazos reales: grabar una tanda, mirar la distribución de arcos por letra y
  # ponerlo donde separe. El razonamiento de partida: el gancho de una J recorre
  # del orden de una o dos veces la distancia muñeca-nudillo.
  min_trajectory_arc: 0.8

  # Meta de repeticiones por letra y sesión. Solo alimenta el contador en
  # pantalla: al alcanzarla no se bloquea nada. ARQUITECTURA.md §4.7 pide ~20 por
  # letra, 2 sesiones por persona, 3 personas.
  target_samples_per_label: 20

# Instrumentación de la tasa de cuadros (src/lsm/telemetry.py).
#
# Existe porque TODOS los umbrales de `segmentation` están expresados en frames y
# los comentarios de esta sección los traducen a milisegundos suponiendo 30 fps.
# Esa suposición no se había medido nunca: si la tubería corre a 12 fps, los 24
# frames del buffer son 2 segundos y no 800 ms, y el deletreo se siente lento sin
# que ningún número de este archivo lo explique. Ver
# docs/adr/0013-la-ventana-mezclada.md.
telemetry:
  # Tasa por debajo de la cual el preview avisa de que lo que falla es el
  # rendimiento y no la seña.
  #
  # A tasas muy bajas ninguna ventana temporal razonable contiene frames
  # suficientes: con `stable_ms: 167`, a 12 fps la estabilidad se decide con 2
  # cuadros y a 6 fps con 1, que es no decidir nada. 12 va justo por debajo del
  # percentil 5 medido en la máquina de referencia (13.8 fps), así que avisa
  # cuando esa máquina cae por debajo de su propio peor caso normal y no en cada
  # bache.
  min_fps: 12.0

  # Cuadros sobre los que se promedia el fps que se muestra en vivo en el
  # preview. Es una media móvil a propósito: promediando la sesión entera, un
  # arranque lento sigue tirando del número diez minutos después y el HUD deja de
  # servir para ver el efecto de lo que se acaba de tocar. A 30 fps, 30 cuadros
  # es un segundo de historia.
  fps_window_frames: 30

  # Cuánto dura `lsm-demo --medir-fps` cuando no se le pasa `--medir-segundos`.
  # Un minuto: suficiente para que la distribución tenga cola —el percentil 5 de
  # 1800 cuadros son los 90 peores— y corto para repetirlo tras cada ajuste.
  benchmark_seconds: 60.0

# Acumulación de letras en palabras (ARQUITECTURA.md §4.2, docs/adr/0012-...).
spelling:
  # Ausencia de mano que cierra la palabra en curso y empieza otra. Un segundo,
  # y ahora un segundo de verdad: en frames eran 1685 ms en la máquina medida.
  #
  # Es el único gesto de control del proyecto. Bajar la mano entre palabras es lo
  # que se hace de todos modos, y el clasificador no tiene clases libres: conoce
  # 22 y las 21 letras están ocupadas, así que un gesto dedicado sería una clase
  # nueva, y una clase nueva son tres personas citadas otra vez.
  #
  # config.py valida que supere a segmentation.missing_to_idle_ms. Si no, un
  # parpadeo del detector partiría una palabra en dos.
  space_after_absent_ms: 1000.0

# Dirección texto → señas (src/lsm/signs.py, docs/adr/0014-assets-como-esqueleto-del-dataset-propio.md).
#
# Aquí no hay clasificador: hay tiempos. Todos en milisegundos a velocidad 1.0;
# el reproductor los multiplica por la velocidad elegida con + y -.
signs:
  # Cuánto se sostiene en pantalla una letra estática.
  static_hold_ms: 1500.0

  # Vueltas completas del GIF de una dinámica. La duración del paso es
  # duracion_ms del manifest por este número. Con 2 vueltas y render_fps a 12
  # una letra dinámica tardaba 15 s; con 1 vuelta son ~5 s.
  dynamic_loops: 1

  # Pausa entre palabras: lo que ocupa un espacio del texto.
  word_gap_ms: 800.0

  # Cuadros por segundo del GIF al renderizar. Fija duracion_ms de cada
  # dinámica en el manifest: round(1000 * frames / render_fps). 18, no 12: es
  # la tasa medida en la Fase 3 (17.8 fps, ver ADR 0013), para que el GIF
  # reproduzca el trazo a la velocidad real de la grabación.
  render_fps: 18

  # Lado del lienzo cuadrado de cada asset, en píxeles, y aire alrededor de la
  # mano como fracción del lienzo por cada lado.
  canvas_px: 320
  canvas_margin: 0.12

  # Límites y paso de la velocidad de reproducción. config.py valida que
  # speed_min < speed_max.
  speed_min: 0.25
  speed_max: 4.0
  speed_step: 0.25

  # Espera de waitKey en cada vuelta del bucle de la ventana. No es el dt del
  # reproductor —ese se mide con el reloj—, solo cada cuánto se lee el teclado.
  tick_ms: 33
